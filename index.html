<style id="site-style">
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #1a1b26; --panel: #16161e; --surface: #1f2335; --surface-2: #24283b; --hover: #2a2f45;
  --border: #2b2f44; --border-strong: #3b4261;
  --text: #c0caf5; --muted: #7982a9; --faint: #565f89; --bright: #e9edff; --on-accent: #0f1220;
  --blue: #7aa2f7; --cyan: #7dcfff; --purple: #bb9af7; --green: #9ece6a; --orange: #ff9e64; --red: #f7768e; --yellow: #e0af68; --teal: #73daca;
  --blue-soft: rgba(122,162,247,.14); --cyan-soft: rgba(125,207,255,.14); --purple-soft: rgba(187,154,247,.14); --green-soft: rgba(158,206,106,.14);
  --orange-soft: rgba(255,158,100,.16); --red-soft: rgba(247,118,142,.14); --yellow-soft: rgba(224,175,104,.14); --teal-soft: rgba(115,218,202,.14);
  --sel: rgba(122,162,247,.16); --grid: rgba(122,162,247,.07);
  --shadow: 0 24px 60px rgba(0,0,0,.5);
  --dot-s: 70%; --dot-l: 66%;
  --title-h: 44px; --tabs-h: 38px; --status-h: 30px; --line: 28px;
}
:root[data-mode="light"] {
  color-scheme: light;
  --bg: #f7f8fc; --panel: #eef0f7; --surface: #ffffff; --surface-2: #f1f3f9; --hover: #e4e8f4;
  --border: #dde1ee; --border-strong: #c3c9dd;
  --text: #2b3049; --muted: #6b7089; --faint: #9096b0; --bright: #12162a; --on-accent: #ffffff;
  --blue: #2e5fd6; --cyan: #0b7aa3; --purple: #7847bd; --green: #3f7216; --orange: #a85200; --red: #c93655; --yellow: #8f6d17; --teal: #0f8a78;
  --blue-soft: rgba(46,95,214,.11); --cyan-soft: rgba(11,122,163,.11); --purple-soft: rgba(120,71,189,.11); --green-soft: rgba(78,140,28,.12);
  --orange-soft: rgba(194,95,0,.12); --red-soft: rgba(201,54,85,.11); --yellow-soft: rgba(143,109,23,.12); --teal-soft: rgba(15,138,120,.11);
  --sel: rgba(46,95,214,.12); --grid: rgba(46,95,214,.07);
  --shadow: 0 20px 50px rgba(30,40,80,.12);
  --dot-s: 62%; --dot-l: 44%;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--title-h) + var(--tabs-h) + 20px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button { font-family: inherit; }
.mono, .tab, .ex-file, .ex-folder, .ex-title, .crumbs, .status, .badge, .tag, .tech, .sha, .btn, .commit-head, .commit-meta, .file-head, .fetch, .typed, .diff-line, .term, .rl, .repo-head, .repo-kicker, .repo-role, .repo-url, .mod-title, .folder-head, .inp, .pal, .kbd { font-family: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, SFMono-Regular, Menlo, monospace; }
.display { font-family: "Chakra Petch", "Noto Kufi Arabic", sans-serif; font-weight: 700; }
[dir="rtl"] .display { font-family: "Noto Kufi Arabic", "Chakra Petch", sans-serif; font-weight: 800; }
[dir="rtl"] .tag, [dir="rtl"] .repo-kicker, [dir="rtl"] .ex-title, [dir="rtl"] .quote .qt { letter-spacing: 0; }
.ic { display: inline-grid; place-items: center; }
.ic svg { width: 16px; height: 16px; display: block; }
.arrow { display: inline-block; }
[dir="rtl"] .arrow { transform: scaleX(-1); }
.muted { color: var(--muted); }

/* accents */
.c-blue { --ac: var(--blue); --ac-soft: var(--blue-soft); }
.c-cyan { --ac: var(--cyan); --ac-soft: var(--cyan-soft); }
.c-purple { --ac: var(--purple); --ac-soft: var(--purple-soft); }
.c-green { --ac: var(--green); --ac-soft: var(--green-soft); }
.c-orange { --ac: var(--orange); --ac-soft: var(--orange-soft); }
.c-red { --ac: var(--red); --ac-soft: var(--red-soft); }
.c-yellow { --ac: var(--yellow); --ac-soft: var(--yellow-soft); }
.c-teal { --ac: var(--teal); --ac-soft: var(--teal-soft); }

/* window chrome */
.win { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(var(--status-h) + env(safe-area-inset-bottom, 0px)); }
.titlebar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--title-h);
  display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.lights { display: flex; gap: 7px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.win-title { flex: 1; text-align: center; font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "IBM Plex Mono", monospace; }
.win-title b { color: var(--text); font-weight: 600; }
.title-actions { display: flex; gap: 6px; align-items: center; flex: none; }
.tb-btn {
  height: 30px; min-width: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid transparent; background: transparent;
  color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: .72rem; font-family: "IBM Plex Mono", monospace;
  transition: background .15s, color .15s, border-color .15s;
}
.tb-btn:hover { background: var(--hover); color: var(--text); }
.tb-btn.accent { color: var(--blue); border-color: var(--border-strong); }
.tb-btn.warn { color: var(--orange); border-color: var(--border-strong); }
.tb-btn:focus-visible, .btn:focus-visible, .tab:focus-visible, .ex-file:focus-visible, .st:focus-visible, .repo:focus-visible, .commit-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.kbd { font-size: .6rem; border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; color: var(--muted); line-height: 1.4; }
.unsaved { display: inline-flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--orange); font-family: "IBM Plex Mono", monospace; }
.unsaved::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }

/* workspace */
.workspace { display: grid; grid-template-columns: 48px 224px minmax(0, 1fr); flex: 1; }
.activity, .explorer {
  position: sticky; top: calc(var(--title-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--title-h) - var(--status-h)); height: calc(100dvh - var(--title-h) - var(--status-h)); background: var(--panel); border-inline-end: 1px solid var(--border);
}
.activity { display: flex; flex-direction: column; align-items: center; padding-block: 10px; gap: 4px; }
.act { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); border: 0; background: transparent; cursor: pointer; position: relative; }
.act::before { content: ''; position: absolute; inset-inline-start: -4px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: transparent; }
.act.on { color: var(--text); }
.act.on::before { background: var(--blue); }
.act:hover { color: var(--text); }
.act.bottom { margin-top: auto; }
.explorer { padding: 10px 0; overflow: auto; }
.ex-title { font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 4px 16px 8px; }
.ex-folder { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: .78rem; color: var(--text); }
.ex-folder .chev { color: var(--faint); font-size: .7rem; }
.ex-file {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 30px; font-size: .78rem; color: var(--muted);
  text-decoration: none; border-inline-start: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[dir="rtl"] .ex-file { padding: 5px 30px 5px 12px; }
.ex-file.sub { padding-inline-start: 46px; }
.ex-file:hover { background: var(--hover); color: var(--text); }
.ex-file.on { background: var(--sel); color: var(--text); border-color: var(--blue); }
.fi { font-size: .64rem; font-weight: 600; width: 18px; text-align: center; flex: none; }
.fi-md { color: var(--blue); } .fi-log { color: var(--cyan); } .fi-dir { color: var(--yellow); } .fi-json { color: var(--yellow); } .fi-sh { color: var(--green); }

.editor { min-width: 0; display: flex; flex-direction: column; }
.tabs {
  position: sticky; top: calc(var(--title-h) + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; height: var(--tabs-h);
  background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: .74rem; color: var(--muted); text-decoration: none;
  border-inline-end: 1px solid var(--border); white-space: nowrap; position: relative; flex: none;
}
.tab.on { color: var(--text); background: var(--bg); }
.tab.on::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--blue); }
.tab .dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); display: none; }
body.dirty .tab .dirty { display: block; }
.crumbs { display: flex; align-items: center; gap: 8px; padding: 7px 20px; font-size: .7rem; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg); overflow: hidden; white-space: nowrap; }
.crumbs .sep { color: var(--faint); }
.crumbs .cur { color: var(--text); }

/* documents */
.editor { container-type: inline-size; }
.doc { position: relative; border-bottom: 1px solid var(--border); }
.gutter {
  position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 60px; overflow: hidden;
  font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--faint); text-align: end; padding: 40px 10px 0 0;
  user-select: none; border-inline-end: 1px solid var(--border); line-height: var(--line);
}
[dir="rtl"] .gutter { padding: 40px 0 0 10px; }
.gutter span { display: block; height: var(--line); }
.body { padding: 40px clamp(20px, 4vw, 56px) 56px; padding-inline-start: calc(60px + clamp(20px, 4vw, 56px)); min-width: 0; }
.doc.readme .body { background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 28px 28px; }
.file-head { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; font-size: .74rem; color: var(--faint); flex-wrap: wrap; }
.file-head .fn { color: var(--muted); }
.file-head .cm::before { content: '// '; }
.h-sec { font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin: 0 0 8px; color: var(--bright); letter-spacing: .01em; text-transform: uppercase; line-height: 1.1; }
[dir="rtl"] .h-sec { line-height: 1.5; }
.sec-intro { margin: 0 0 26px; max-width: 62ch; color: var(--text); }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }

/* README */
.readme-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(24px, 4vw, 48px); align-items: start; }
@container (max-width: 820px) { .readme-grid { grid-template-columns: minmax(0, 1fr); } .fetch { max-width: 560px; } }
@media (max-width: 1000px) and (min-width: 901px) { .readme-grid { grid-template-columns: minmax(0, 1fr); } }
.md-h1 { font-size: clamp(2.5rem, 6.2vw, 4.8rem); line-height: 1; margin: 6px 0 14px; color: var(--bright); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; text-wrap: balance; }
[dir="rtl"] .md-h1 { line-height: 1.35; font-size: clamp(2.2rem, 5.5vw, 4rem); }
.md-h1 .hash { color: var(--faint); font-family: "IBM Plex Mono", monospace; font-weight: 400; font-size: .5em; vertical-align: .4em; margin-inline-end: .25em; }
.typed { font-size: clamp(1rem, 1.7vw, 1.2rem); color: var(--cyan); min-height: 1.7em; }
.typed .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--cyan); vertical-align: -.15em; margin-inline-start: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0; }
.badge { display: inline-flex; font-size: .68rem; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-strong); position: relative; }
.badge .k { background: var(--surface-2); color: var(--muted); padding: 4px 8px; }
.badge .v { background: var(--blue-soft); color: var(--blue); padding: 4px 8px; font-weight: 600; }
.prose { font-size: 1.06rem; max-width: 62ch; }
.prose b, .prose strong { color: var(--bright); font-weight: 600; }
.quote { border-inline-start: 3px solid var(--purple); padding: 10px 16px; margin: 18px 0; color: var(--text); background: var(--purple-soft); border-radius: 0 8px 8px 0; max-width: 62ch; white-space: pre-line; }
[dir="rtl"] .quote { border-radius: 8px 0 0 8px; }
.quote .qt { font-family: "IBM Plex Mono", "IBM Plex Sans Arabic", monospace; font-size: .7rem; color: var(--purple); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; display: block; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); text-decoration: none; font-size: .8rem; font-weight: 600; cursor: pointer; line-height: 1.3;
  transition: transform .15s, background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.btn.primary { background: var(--blue); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: .72rem; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: none; }

/* neofetch card */
.fetch { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; font-size: .78rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.fetch::before { content: ''; position: absolute; inset: 0; background: radial-gradient(80% 60% at 100% 0%, var(--blue-soft), transparent 60%); pointer-events: none; }
.fetch-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; position: relative; }
.fetch-logo { font-size: 3rem; line-height: 1; color: var(--blue); text-shadow: 0 0 28px var(--blue-soft); letter-spacing: -.02em; padding-top: 4px; }
.fetch-lines { min-width: 0; }
.fetch-user { color: var(--green); font-weight: 600; margin-bottom: 2px; direction: ltr; text-align: start; }
.fetch-user .at { color: var(--faint); }
.fetch-rule { color: var(--faint); margin-bottom: 6px; letter-spacing: -.05em; }
.fetch-line { display: flex; gap: 8px; line-height: 1.75; align-items: baseline; }
.fetch-line .k { color: var(--purple); flex: none; min-width: 58px; }
.fetch-line .k::after { content: ':'; color: var(--faint); }
.fetch-line .v { color: var(--text); overflow-wrap: anywhere; }
.swatches { display: flex; gap: 4px; margin-top: 14px; }
.swatches i { width: 20px; height: 12px; border-radius: 2px; display: block; }
@media (max-width: 420px) { .fetch-grid { grid-template-columns: 1fr; } .fetch-logo { font-size: 2.6rem; } }

/* skills modules */
.stack { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.mod { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; position: relative; }
.mod-title { font-size: .74rem; color: var(--muted); margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
.mod-title .key { color: var(--cyan); }
.mod-title .cnt { color: var(--faint); margin-inline-start: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tech { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: .72rem; line-height: 1.4; }
.tech i { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) var(--dot-s) var(--dot-l)); flex: none; }

/* git log */
.git { display: grid; }
.commit { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 14px; position: relative; }
.rail { position: relative; }
.rail::before { content: ''; position: absolute; top: 0; bottom: 0; inset-inline-start: 19px; width: 2px; background: var(--border-strong); }
.commit:first-child .rail::before { top: 22px; }
.commit:last-child .rail::before { height: 22px; bottom: auto; }
.commit:only-child .rail::before { display: none; }
.node { position: absolute; top: 14px; inset-inline-start: 12px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 3px solid var(--ac); box-shadow: 0 0 0 4px var(--bg); }
.node.live::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--ac); opacity: .6; animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.55); opacity: .8; } 100% { transform: scale(1.4); opacity: 0; } }
.commit-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; cursor: pointer; transition: border-color .2s, background .2s; position: relative; }
.commit-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
.commit-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .72rem; color: var(--muted); }
.sha { color: var(--orange); font-weight: 600; direction: ltr; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .64rem; font-weight: 600; background: var(--ac-soft); color: var(--ac); text-transform: uppercase; letter-spacing: .06em; }
.tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ac); }
.commit-msg { font-size: 1.1rem; font-weight: 600; color: var(--bright); margin: 8px 0 4px; line-height: 1.35; }
.commit-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .72rem; color: var(--muted); }
.commit-meta .k { color: var(--faint); }
.diff { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.diff > div { overflow: hidden; min-height: 0; }
.commit-card.open .diff { grid-template-rows: 1fr; }
.diff-body { margin-top: 14px; border-top: 1px dashed var(--border-strong); padding-top: 12px; }
.diff-line { display: flex; gap: 10px; font-size: .78rem; line-height: 1.6; padding: 4px 10px; border-radius: 4px; background: var(--green-soft); color: var(--text); white-space: pre-wrap; }
.diff-line::before { content: '+'; color: var(--green); font-weight: 700; flex: none; }
.diff-skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.diff-skills .k { font-family: "IBM Plex Mono", monospace; font-size: .68rem; color: var(--faint); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; padding: 3px; background: var(--surface); }
.seg-btn { border: 0; background: transparent; color: var(--muted); font-family: "IBM Plex Mono", "IBM Plex Sans Arabic", monospace; font-size: .7rem; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg-btn.on { background: var(--sel); color: var(--blue); }

/* repos */

.status {

  function save() {
    if (!state.dirty || state.saving) return;
    stampUpdated();
    if (state.can === 'local') {
      try { localStorage.setItem(DATA_KEY, JSON.stringify(state.data)); toast(t('savedLocal')); }
      catch (e) { toast(t('sessionOnly')); }
      finishEdit();
      return;
    }
    if (state.can !== 'artifact' || !state.artifact) return;
    setSaving(true);
    var html = buildDocument(state.data);
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state.data)); } catch (e) {}
    state.artifact.publish(html).then(function () {
      setSaving(false); toast(t('saved')); finishEdit();
    }, function (err) {
      setSaving(false);
      var code = err && err.code;
      if (code === 'conflict') toast(t('conflict'));
      else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required') { state.can = 'none'; toast(t('readonly')); finishEdit(); }
      else if (code === 'rate_limited') toast(t('slow'));
      else if (code === 'too_large') toast(t('tooLarge'));
      else toast(t('failed') + (err && err.message ? ': ' + err.message : ''));
    });
  }
  function exportHtml() {
    var fname = (slug('-') || 'index') + '.html';
    if (!state.downloads) {
      try {
        var blob = new Blob([buildDocument(state.data)], { type: 'text/html;charset=utf-8' });
        var url2 = URL.createObjectURL(blob);
        var a2 = document.createElement('a');
        a2.href = url2; a2.download = fname; a2.rel = 'noopener';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(function () { URL.revokeObjectURL(url2); }, 1500);
        toast(t('exported'));
      } catch (e) { toast(t('failed')); }
      return;
    }
    state.downloads.save({ filename: slug('-') + '.html', data: buildDocument(state.data) }).then(function () { toast(t('exported')); }, function (err) {
      if (err && err.code === 'declined') toast(t('declined'));
      else toast(t('failed') + (err && err.message ? ': ' + err.message : ''));
    });
  }
  function maybeRestoreDraft() {
    if (!state.pendingDraft || state.can === 'none') return;
    state.pendingDraft = false;
    state.snapshot = JSON.parse(JSON.stringify(state.data));
    state.editing = true; state.dirty = true;
    render();
    toast(t('restored'));
  }

  /* ---------- boot ---------- */
  function ensureData(d) {
    if (!d) return d;
    if (!Array.isArray(d.certificates)) d.certificates = [];
    if (!Array.isArray(d.recommendations)) d.recommendations = [];
    if (typeof d.resume !== 'string') d.resume = '';
    if (typeof d.photo !== 'string') d.photo = '';
    if (typeof d.updated !== 'string') d.updated = '';
    if (typeof d.locked !== 'boolean') d.locked = false;
    (d.projects || []).forEach(function (g) {
      (g.items || []).forEach(function (pr) { if (typeof pr.image !== 'string') pr.image = ''; });
    });
    return d;
  }
  function boot() {
    var seed = document.getElementById('site-data');
    if (!seed) { showFatal('Missing site data.'); return; }
    try { state.data = ensureData(JSON.parse(seed.textContent)); }
    catch (e) { showFatal('Site data could not be read.'); return; }
    var hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (!hasClaude) { try { var s = localStorage.getItem(DATA_KEY); if (s) state.data = ensureData(JSON.parse(s)); } catch (e) {} }
    try {
      var raw = sessionStorage.getItem(DRAFT_KEY);
      if (raw) {
        var draft = JSON.parse(raw);
        if (JSON.stringify(draft) !== JSON.stringify(state.data)) { state.data = ensureData(draft); state.pendingDraft = true; }
        else sessionStorage.removeItem(DRAFT_KEY);
      }
    } catch (e) {}
    var lang = null, mode = null;
    try { lang = localStorage.getItem(LANG_KEY); mode = localStorage.getItem(MODE_KEY); } catch (e) {}
    state.lang = (state.data.bilingual !== false && (lang === 'en' || lang === 'ar')) ? lang : (state.data.lang === 'ar' ? 'ar' : 'en');
    state.mode = mode === 'light' ? 'light' : 'dark';
    applyChrome();
    render();
    // A locked page is read-only everywhere; only the verified owner on claude.ai can still edit it.
    // Off claude.ai there is no authority to ask, so an unlocked copy stays editable in that browser.
    function fallbackEditing() {
      if (state.can !== 'none' || state.data.locked) return;
      state.can = 'local';
      render(); maybeRestoreDraft();
    }
    if (!hasClaude) { fallbackEditing(); return; }
    var settled = false;
    Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('downloads')]).then(function (r) {
      var user = r[0], art = r[1];
      state.downloads = r[2] || null;
      return (user ? user.canEdit() : Promise.resolve(false)).then(function (ok) {
        settled = true;
        if (ok && art) { state.can = 'artifact'; state.artifact = art; render(); maybeRestoreDraft(); }
        else fallbackEditing();
      });
    }).catch(function () { settled = true; fallbackEditing(); });
    // if the viewer never answers, don't leave the page stuck in read-only
    setTimeout(function () { if (!settled) fallbackEditing(); }, 3000);
  }
  /* ---------- added: keep the focused field above the on-screen keyboard ---------- */
  (function mobileEditingComfort() {
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    if (!coarse) return;
    document.addEventListener('focusin', function (e) {
      var el = e.target;
      if (!el) return;
      var editable = el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
      if (!editable) return;
      setTimeout(function () {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
      }, 300);
    });
  })();

  function showFatal(msg) {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '';
    app.appendChild(h('div', { class: 'noscript-note' },
      h('h1', null, 'Something went wrong'),
      h('p', null, msg),
      h('p', null, h('a', { href: 'mailto:abdualaziz1777@gmail.com' }, 'abdualaziz1777@gmail.com'))));
  }
  window.addEventListener('error', function () {
    var app = document.getElementById('app');
    if (app && !app.firstChild) showFatal('The page failed to load in this browser.');
  });
  try { boot(); }
  catch (e) { showFatal(e && e.message ? e.message : 'Unexpected error.'); }
})();
</script>
