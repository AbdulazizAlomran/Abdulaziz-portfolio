<script>
(function () {
  'use strict';
  /* ---------- content ---------- */
  var C = JSON.parse(document.getElementById('content').textContent);

  /* ---------- tiny template engine ---------- */
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }

    return str.replace(HOLE, function (_, p) { var v = resolve(ctx, p); return v == null ? '' : String(v); });

      var list = resolve(ctx, (node.getAttribute('list') || '').replace(WHOLE, '$1')) || [];
      var as = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) { var e = {}; e[as] = list[i]; e.$index = i; renderChildren(node, child(ctx, e), out); }
      return;
    }
    if (tag === 'sc-if') {
      if (resolve(ctx, (node.getAttribute('value') || '').replace(WHOLE, '$1'))) renderChildren(node, ctx, out);
      return;
    }
    var el = node.cloneNode(false);
    for (var a = node.attributes.length - 1; a >= 0; a--) {
      var at = node.attributes[a], name = at.name, val = at.value;
      if (val.indexOf('{{') < 0) continue;
      var m = val.match(WHOLE);
      if (name.slice(0, 2) === 'on' && m) {
        el.removeAttribute(name);
        var fn = resolve(ctx, m[1]);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
      } else {
        el.setAttribute(name, interp(val, ctx));
      }

    renderChildren(node, ctx, el);
    out.appendChild(el);
  }
  function renderInto(tplNode, ctx) { var f = document.createDocumentFragment(); renderNode(tplNode, ctx, f); return f; }

  /* ---------- state + view model ---------- */
  var saved = null, savedTheme = null;

  var prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var app = {
    state: { theme: savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (prefersDark ? 'dark' : 'light'), lang: saved === 'en' || saved === 'ar' ? saved : 'ar', filter: 'all', copied: false, jtab: 'education', scrolled: false, active: 'top' },
    setState: function (patch) {
      var regions = {};
      for (var k in patch) {
        if (this.state[k] === patch[k]) continue;
        this.state[k] = patch[k];
        if (k === 'lang') regions.all = 1;
        else if (k === 'filter') regions.projects = 1;
        else if (k === 'jtab') regions.journey = 1;
        else if (k === 'copied') regions.contact = 1;
        else regions.scroll = 1;
      }
      if (regions.all) { try { localStorage.setItem('pf-lang', this.state.lang); } catch (e) {} renderAll(); return; }
      if (regions.projects) renderRegion('projects');
      if (regions.journey) renderRegion('journey');
      if (regions.contact) renderRegion('contact');
      if (regions.scroll) applyScroll();
    }
  };

  function vals() {
    var self = app, st = app.state;
    var lang = st.lang, t = DATA[lang], filter = st.filter;
    var tags = ['all'];
    t.projects.forEach(function (p) { if (tags.indexOf(p.tag) < 0) tags.push(p.tag); });
    var filters = tags.map(function (tag) {
      var on = filter === tag;
      return { label: tag === 'all' ? t.ui.all : tag, pressed: on ? 'true' : 'false',
        bg: on ? 'var(--card)' : 'transparent', fg: on ? 'var(--accent-text)' : 'var(--muted)', shadow: on ? '0 1px 3px rgba(15,23,42,.12)' : 'none',
        pick: function () { self.setState({ filter: tag }); } };
    });
    var projects = t.projects.filter(function (p) { return filter === 'all' || p.tag === filter; })
      .map(function (p) { return Object.assign({}, p, { isBI: p.kind === 'bi', isPy: p.kind === 'py', isSQL: p.kind === 'sql' }); });
    var shades = ['1', '.7', '.45', '.22'];
    var skillsX = t.skills.map(function (g, i) { return Object.assign({}, g, { count: g.items.length, shade: shades[i] || '.2' }); });
    var skillTable = t.skills.map(function (g) {
      return { group: g.group, count: g.items.length, rows: g.items.map(function (s) {
        var nums = t.projects.filter(function (p) { return (p.skills || []).indexOf(s) > -1; }).map(function (p) { return '#' + p.num; });
        return { name: s, used: nums.length ? t.ui.usedIn + ' ' + nums.join(' ') : (LEARNING.indexOf(s) > -1 ? t.ui.learning : '✓') };

    var jtab = st.jtab;
    var journeyTabs = ['education', 'certificates', 'volunteering', 'awards'].map(function (key) {

      return { label: t[key + 'Title'], count: (t[key] || []).length, pressed: on ? 'true' : 'false',
        bg: on ? 'var(--card)' : 'transparent', fg: on ? 'var(--accent-text)' : 'var(--muted)', shadow: on ? '0 1px 3px rgba(15,23,42,.12)' : 'none',
        countBg: on ? 'var(--tint)' : 'var(--line)', countFg: on ? 'var(--accent-text)' : 'var(--muted)',

    var journeyItems = toned(t[jtab]);
    var nav = {};
    ['top', 'about', 'journey', 'projects', 'skills', 'contact'].forEach(function (id) {
      var on = st.active === id; nav[id] = { bg: on ? '#1E293B' : 'transparent', fg: on ? '#fff' : '#CBD5E1' };
    });
    return {
      t: t, lang: lang, dir: lang === 'ar' ? 'rtl' : 'ltr',
      hasProjects: t.projects.length > 0, noProjects: t.projects.length === 0,
      kpis: t.kpis.map(function (k) {
        if (k.href === '#projects') return Object.assign({}, k, { n: String(t.projects.length) });

        return k;
      }),
      filters: filters, projects: projects, skillsX: skillsX, skillTable: skillTable,
      journeyTabs: journeyTabs, journeyItems: journeyItems, journeyEmpty: journeyItems.length === 0,
      projectCount: t.projects.length,
      skillCount: t.skills.reduce(function (n, g) { return n + g.items.length; }, 0),
      nav: nav,
      dockOpacity: st.scrolled ? '1' : '0',
      dockTransform: st.scrolled ? 'translateY(0) scale(1)' : 'translateY(18px) scale(.96)',
      dockVis: st.scrolled ? 'visible' : 'hidden',
      dockHidden: st.scrolled ? 'false' : 'true',
      copyLabel: st.copied ? t.ui.copied : t.ui.copy,
      copyEmail: function () {
        try { navigator.clipboard.writeText(t.email); } catch (e) {}
        self.setState({ copied: true });
        clearTimeout(self._ct); self._ct = setTimeout(function () { self.setState({ copied: false }); }, 1800);
      },
      themeClass: st.theme === 'dark' ? 'dark' : '',
      toggleTheme: function () {
        st.theme = st.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('pf-theme', st.theme); } catch (e) {}
        var root = mount.firstElementChild; if (root) root.classList.toggle('dark', st.theme === 'dark');
        document.documentElement.classList.toggle('dk', st.theme === 'dark');
        var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.setAttribute('content', st.theme === 'dark' ? '#0B1120' : '#0F172A');
      },
      sbOpen: '', menuExpanded: 'false',
      toggleMenu: function () { setMenu(!document.getElementById('sidebar').classList.contains('sb-open')); },
      closeMenu: function () { setMenu(false); },
      toggle: function () { self.setState({ lang: lang === 'ar' ? 'en' : 'ar' }); }
    };
  }

  function setMenu(open) {
    var sb = document.getElementById('sidebar'); if (!sb) return;
    sb.classList.toggle('sb-open', open);
    var b = sb.querySelector('.mbar button'); if (b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* ---------- rendering ---------- */
  var tpl = document.getElementById('tpl').content;
  var rootTpl = tpl.firstElementChild;
  var mount = document.getElementById('app');
  var noSDT = !(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()'));
  if (noSDT) document.documentElement.classList.add('no-sdt');
  var io = noSDT && 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.12 }) : null;

  function renderAll() {
    var v = vals();
    document.documentElement.lang = v.lang;
    document.documentElement.dir = v.dir;
    document.documentElement.classList.toggle('dk', app.state.theme === 'dark');
    document.title = v.t.name + ' — Portfolio';
    var y = window.scrollY;
    mount.textContent = '';
    mount.appendChild(renderInto(rootTpl, v));
    window.scrollTo(0, y);
    if (noSDT) mount.querySelectorAll('.rv').forEach(function (el) { io ? io.observe(el) : el.classList.add('in'); });
    applyScroll();
  }
  function renderRegion(id) {
    var src = tpl.querySelector('#' + id), live = document.getElementById(id);
    if (!src || !live) return renderAll();
    var frag = renderInto(src, vals());
    var fresh = frag.firstElementChild;
    if (noSDT) fresh.classList.add('in');
    live.replaceWith(fresh);
  }
  function applyScroll() {
    var st = app.state;
    mount.querySelectorAll('a.d-nav').forEach(function (a) {
      var on = a.getAttribute('href') === '#' + st.active;
      a.style.background = on ? '#1E293B' : 'transparent';
      a.style.color = on ? '#fff' : '#CBD5E1';
    });
    var dock = document.getElementById('dock');
    if (dock) {
      dock.style.opacity = st.scrolled ? '1' : '0';
      dock.style.transform = st.scrolled ? 'translateY(0) scale(1)' : 'translateY(18px) scale(.96)';
      dock.style.visibility = st.scrolled ? 'visible' : 'hidden';
      dock.setAttribute('aria-hidden', st.scrolled ? 'false' : 'true');
    }
  }
  var raf = 0;
  window.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      var y = window.scrollY, sc = app.state.scrolled ? y > 100 : y > 180, active = 'top';
      ['about', 'journey', 'projects', 'skills', 'contact'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.4) active = id;
      });
      var d = document.documentElement;
      if (window.innerHeight + y >= d.scrollHeight - 8) active = 'contact';
      app.setState({ scrolled: sc, active: active });
    });
  }, { passive: true });

  renderAll();
})();

</script>
</body>
</html>
